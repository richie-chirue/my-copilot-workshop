<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待辦清單</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="todo-card" aria-labelledby="page-title">
      <header class="app-header">
        <div class="header-content">
          <div>
            <p class="eyebrow">今日專注</p>
            <h1 id="page-title">待辦清單</h1>
          </div>
          <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切換至深色模式"></button>
        </div>
        <p class="subtitle">把腦中的大小事，一件一件完成。</p>
      </header>

      <form class="todo-form" id="todo-form">
        <label class="sr-only" for="todo-input">新增待辦事項</label>
        <input
          id="todo-input"
          name="todo"
          type="text"
          placeholder="接下來要完成什麼？"
          autocomplete="off"
          maxlength="120"
        >
        <button type="submit">新增</button>
      </form>

      <nav class="filter-tabs" aria-label="待辦事項篩選">
        <button class="filter-button is-active" type="button" data-filter="all">全部</button>
        <button class="filter-button" type="button" data-filter="active">未完成</button>
        <button class="filter-button" type="button" data-filter="completed">已完成</button>
      </nav>

      <ul class="todo-list" id="todo-list" aria-live="polite"></ul>
      <p class="empty-state" id="empty-state"></p>

      <footer class="app-footer">
        <div class="footer-content">
          <span id="remaining-count">未完成：0 項</span>
          <button class="clear-completed-button" id="clear-completed-button" type="button" aria-label="清除所有已完成的待辦事項">
            清除已完成
          </button>
        </div>
      </footer>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
